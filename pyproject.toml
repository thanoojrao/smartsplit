[project]
name = "smartsplit"
version = "0.1.0"
description = "Self-hostable smart expense splitter: snap a receipt, it splits items by who actually uses them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "phonenumbers>=8.13",
]

[project.scripts]
smartsplit = "smartsplit.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartsplit"]

# ---------- quality gates (do not loosen; see CLAUDE.md) ----------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PTH", "N", "ERA", "PL", "RUF", "T20", "S", "TID", "DTZ", "FIX"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "TID251"]
# Only the edges may touch the clock, randomness, ids, logging and the environment (SPEC §2-3).
"src/smartsplit/adapters/**" = ["TID251"]
"src/smartsplit/entrypoints/**" = ["TID251"]
"src/smartsplit/config.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use the Clock port (SPEC §3)."
"datetime.datetime.utcnow".msg = "Use the Clock port (SPEC §3)."
"datetime.datetime.today".msg = "Use the Clock port (SPEC §3)."
"datetime.date.today".msg = "Use the Clock port (SPEC §3)."
"time.time".msg = "Use the Clock port (SPEC §3)."
"time.monotonic".msg = "Use the Clock port (SPEC §3)."
"uuid.uuid4".msg = "Use the IdGenerator port (SPEC §3)."
"uuid.uuid1".msg = "Use the IdGenerator port (SPEC §3)."
"random".msg = "No randomness outside adapters (SPEC §2)."
"secrets".msg = "No randomness outside adapters (SPEC §2)."
"logging".msg = "No logging in the core; side effects belong in adapters (SPEC §2)."
"os.environ".msg = "Read settings only in config.py and entrypoints (SPEC §2)."
"os.getenv".msg = "Read settings only in config.py and entrypoints (SPEC §2)."

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: needs a real Postgres at TEST_DATABASE_URL (never DATABASE_URL); fails, never skips, if unreachable",
    "live: calls the real Anthropic API; runs only when SMARTSPLIT_LIVE_LLM=1",
]

[tool.coverage.run]
source = ["smartsplit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "smartsplit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (SPEC section 2)"
type = "layers"
layers = [
    "smartsplit.entrypoints",
    "smartsplit.adapters",
    "smartsplit.services",
    "smartsplit.ports",
    "smartsplit.engine | smartsplit.ledger",
    "smartsplit.domain",
]

[[tool.importlinter.contracts]]
name = "Pure core has no I/O frameworks"
type = "forbidden"
source_modules = [
    "smartsplit.domain",
    "smartsplit.engine",
    "smartsplit.ledger",
    "smartsplit.ports",
    "smartsplit.services",
]
forbidden_modules = ["anthropic", "sqlalchemy", "alembic", "fastapi", "typer", "psycopg"]

[[tool.importlinter.contracts]]
name = "Only the LLM adapter talks to Anthropic"
type = "forbidden"
source_modules = ["smartsplit.adapters.db", "smartsplit.adapters.fakes", "smartsplit.entrypoints"]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "Only the DB adapter talks to the database"
type = "forbidden"
source_modules = ["smartsplit.adapters.llm", "smartsplit.adapters.fakes", "smartsplit.entrypoints"]
forbidden_modules = ["sqlalchemy", "alembic", "psycopg"]

[[tool.importlinter.contracts]]
name = "Web and CLI frameworks stay in their entrypoints"
type = "forbidden"
source_modules = ["smartsplit.adapters", "smartsplit.entrypoints.cli"]
forbidden_modules = ["fastapi", "uvicorn"]

[[tool.importlinter.contracts]]
name = "CLI framework stays in the CLI entrypoint"
type = "forbidden"
source_modules = ["smartsplit.adapters", "smartsplit.entrypoints.api"]
forbidden_modules = ["typer"]

[[tool.importlinter.contracts]]
name = "Adapters are independent of each other"
type = "independence"
modules = [
    "smartsplit.adapters.db",
    "smartsplit.adapters.llm",
    "smartsplit.adapters.files",
    "smartsplit.adapters.fakes",
]

[[tool.importlinter.contracts]]
name = "Settings are read only at the edges and injected elsewhere"
type = "forbidden"
source_modules = [
    "smartsplit.domain",
    "smartsplit.engine",
    "smartsplit.ledger",
    "smartsplit.ports",
    "smartsplit.services",
    "smartsplit.adapters",
]
forbidden_modules = ["pydantic_settings"]
