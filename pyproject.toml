[project]
name = "smartsplit"
version = "0.1.0"
description = "Self-hostable smart expense splitter: snap a receipt, it splits items by who actually uses them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "typer>=0.12",
    "rapidfuzz>=3.9",
]

[project.scripts]
smartsplit = "smartsplit.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartsplit"]

# ---------- quality gates (do not loosen; see CLAUDE.md) ----------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PTH", "N", "ERA", "PL", "RUF", "T20", "S"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["smartsplit"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: needs a real Postgres at DATABASE_URL",
    "live: calls the real Anthropic API; runs only when SMARTSPLIT_LIVE_LLM=1",
]

[tool.coverage.run]
source = ["smartsplit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "smartsplit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (SPEC section 2)"
type = "layers"
layers = [
    "smartsplit.entrypoints",
    "smartsplit.adapters",
    "smartsplit.services",
    "smartsplit.ports",
    "smartsplit.engine | smartsplit.ledger",
    "smartsplit.domain",
]

[[tool.importlinter.contracts]]
name = "Pure core has no I/O frameworks"
type = "forbidden"
source_modules = [
    "smartsplit.domain",
    "smartsplit.engine",
    "smartsplit.ledger",
    "smartsplit.ports",
    "smartsplit.services",
]
forbidden_modules = ["anthropic", "sqlalchemy", "alembic", "fastapi", "typer", "psycopg"]

[[tool.importlinter.contracts]]
name = "Only the LLM adapter talks to Anthropic"
type = "forbidden"
source_modules = ["smartsplit.adapters.db", "smartsplit.adapters.fakes", "smartsplit.entrypoints"]
forbidden_modules = ["anthropic"]
