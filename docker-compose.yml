# Local development Postgres. Cloud sessions use the preinstalled Postgres instead
# (see scripts/session_start.sh).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartsplit
    ports:
      - "127.0.0.1:5432:5432"  # local only; never expose the default password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
